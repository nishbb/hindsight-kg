[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kggc"
version = "0.1.0"
description = "Hindsight / kg-gc: predicting which genotype-phenotype knowledge graph edges will be revised, using GNN-guided agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "pyyaml>=6",
  "requests>=2.31",
  "tqdm>=4.66",
  "matplotlib>=3.8",
  "networkx>=3.2",
  "torch>=2.2",
  "torch_geometric>=2.5",
  "openai>=1.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "black>=24", "pre-commit>=3.6"]

[project.scripts]
kggc-dossier = "kggc.variant_dossier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["network: tests that hit live APIs (deselected in CI)"]
